<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gestión de Base de Datos</title>
    <style>
        /* Estilos base */
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #121212;
            color: #ffffff;
            margin: 0;
            padding: 40px 20px;
        }
        
        /* Contenedor principal */
        .container {
            max-width: 800px;
            margin: 0 auto;
            background-color: #1e1e1e;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0 8px 16px rgba(0,0,0,0.5);
        }

        h1, h2 {
            text-align: center;
            color: #4CAF50;
            margin-bottom: 25px;
        }

        /* Entradas de formulario separadas y alineadas */
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 8px;
            font-weight: bold;
        }

        input[type="text"] {
            width: 100%;
            padding: 12px;
            background-color: #2d2d2d;
            border: 1px solid #444;
            color: #ffffff;
            border-radius: 6px;
            box-sizing: border-box; /* Evita que el padding desborde el ancho */
            font-size: 14px;
        }

        /* Botón de envío */
        button {
            width: 100%;
            background-color: #4CAF50;
            color: white;
            border: none;
            padding: 14px;
            margin-top: 10px;
            cursor: pointer;
            border-radius: 6px;
            font-weight: bold;
            font-size: 16px;
            transition: background-color 0.2s;
        }

        button:hover {
            background-color: #45a049;
        }

        /* Tabla de base de datos */
        table {
            width: 100%;
            border-collapse: collapse;
            margin-top: 30px;
            background-color: #252525;
            border-radius: 8px;
            overflow: hidden;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #333;
        }

        th {
            background-color: #333;
            color: #4CAF50;
        }
        
        tr:hover {
            background-color: #2a2a2a;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Panel de Control de Datos</h1>
        
        <div class="form-group">
            <label for="usuario">Usuario / ID:</label>
            <input type="text" id="usuario" placeholder="Ej. Mod_Admin">
        </div>
        
        <div class="form-group">
            <label for="accion">Registro de Actividad / Log:</label>
            <input type="text" id="accion" placeholder="Ej. Solicitud enviada">
        </div>
        
        <button onclick="enviarRegistro()">Guardar en SQLite</button>

        <h2>Registros Almacenados</h2>
        <table id="tabla-registros">
            <thead>
                <tr>
                    <th>ID</th>
                    <th>Usuario</th>
                    <th>Acción</th>
                    <th>Fecha y Hora</th>
                </tr>
            </thead>
            <tbody>
                <!-- Los datos inyectados por JavaScript aparecerán aquí -->
            </tbody>
        </table>
    </div>

    <script>
        // Obtener y renderizar los datos
        async function cargarRegistros() {
            try {
                const respuesta = await fetch('/api/registros');
                const json = await respuesta.json();
                const tbody = document.querySelector('#tabla-registros tbody');
                tbody.innerHTML = ''; 
                
                json.data.forEach(registro => {
                    const fila = document.createElement('tr');
                    fila.innerHTML = `
                        <td>${registro.id}</td>
                        <td>${registro.usuario}</td>
                        <td>${registro.accion}</td>
                        <td>${new Date(registro.fecha).toLocaleString('es-MX')}</td>
                    `;
                    tbody.appendChild(fila);
                });
            } catch (error) {
                console.error('Error al cargar datos:', error);
            }
        }

        // Enviar un nuevo registro a la base de datos
        async function enviarRegistro() {
            const usuario = document.getElementById('usuario').value;
            const accion = document.getElementById('accion').value;

            if (!usuario || !accion) {
                alert('Faltan datos por completar.');
                return;
            }

            try {
                const respuesta = await fetch('/api/registros', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ usuario, accion })
                });

                if (respuesta.ok) {
                    // Limpiar las cajas de texto y actualizar tabla
                    document.getElementById('usuario').value = '';
                    document.getElementById('accion').value = '';
                    cargarRegistros();
                }
            } catch (error) {
                console.error('Error:', error);
            }
        }

        // Ejecutar carga de datos al abrir
        window.onload = cargarRegistros;
    </script>
</body>
</html>
