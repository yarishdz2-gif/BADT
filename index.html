<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Panel de Control - Hub</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: #0d1117;
            color: #c9d1d9;
            margin: 0;
            padding: 0;
            display: flex;
            height: 100vh;
        }

        /* --- LOGIN FORM --- */
        #auth-container {
            width: 100%;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #0d1117;
        }

        .auth-box {
            background-color: #161b22;
            padding: 40px;
            border-radius: 12px;
            border: 1px solid #30363d;
            box-shadow: 0 8px 24px rgba(0,0,0,0.8);
            width: 320px;
            text-align: center;
        }

        .auth-box h2 { margin-top: 0; color: #58a6ff; }
        
        .auth-box input {
            width: 100%;
            padding: 12px;
            margin-bottom: 15px;
            background-color: #0d1117;
            border: 1px solid #30363d;
            color: white;
            border-radius: 6px;
            box-sizing: border-box;
        }

        /* Los iconos y botones están estrictamente alineados con gap para no superponerse */
        .btn {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 10px;
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 6px;
            font-weight: bold;
            cursor: pointer;
            margin-bottom: 10px;
            transition: 0.2s;
        }
        
        .btn-login { background-color: #238636; color: white; }
        .btn-login:hover { background-color: #2ea043; }
        .btn-register { background-color: #1f6feb; color: white; }
        .btn-register:hover { background-color: #388bfd; }

        /* --- DASHBOARD UI --- */
        #dashboard-container {
            display: none;
            width: 100%;
            height: 100%;
            flex-direction: column;
        }

        .navbar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            background-color: #161b22;
            padding: 15px 30px;
            border-bottom: 1px solid #30363d;
        }

        .navbar-tabs {
            display: flex;
            gap: 15px;
        }

        .tab-btn {
            display: flex;
            align-items: center;
            gap: 8px;
            background: none;
            border: 1px solid transparent;
            color: #8b949e;
            padding: 8px 15px;
            cursor: pointer;
            border-radius: 6px;
            font-size: 15px;
            font-weight: 600;
        }

        .tab-btn:hover { color: #c9d1d9; background-color: #21262d; }
        .tab-btn.active { color: #58a6ff; border-color: #30363d; background-color: #0d1117; }

        .btn-logout { background-color: #da3633; color: white; border: none; padding: 8px 15px; border-radius: 6px; cursor: pointer;}
        
        /* Contenido de las tablas */
        .content { padding: 30px; overflow-y: auto; }
        .view-section { display: none; }
        .view-section.active { display: block; }

        table { width: 100%; border-collapse: collapse; background-color: #161b22; border-radius: 8px; overflow: hidden; border: 1px solid #30363d;}
        th, td { padding: 15px; text-align: left; border-bottom: 1px solid #30363d; }
        th { background-color: #21262d; color: #8b949e; }
        tr:hover { background-color: #1f2428; }
        
        .badge { padding: 4px 8px; border-radius: 12px; font-size: 11px; font-weight: bold; }
        .badge-owner { background-color: #8957e5; color: white; }
    </style>
</head>
<body>

    <!-- PORTAL DE LOGIN / REGISTRO -->
    <div id="auth-container">
        <div class="auth-box">
            <h2>🔐 Acceso al Panel</h2>
            <input type="text" id="username" placeholder="Nombre de usuario">
            <input type="password" id="password" placeholder="Contraseña">
            
            <button class="btn btn-login" onclick="login()">
                <span>🔓</span> <span>Iniciar Sesión</span>
            </button>
            <button class="btn btn-register" onclick="register()">
                <span>📝</span> <span>Registrar Admin</span>
            </button>
            <p id="auth-msg" style="color: #f85149; font-size: 13px; margin-top: 10px;"></p>
        </div>
    </div>

    <!-- DASHBOARD PRINCIPAL -->
    <div id="dashboard-container">
        <div class="navbar">
            <div class="navbar-tabs">
                <button class="tab-btn active" onclick="cambiarVista('usuarios')">👥 Usuarios</button>
                <button class="tab-btn" onclick="cambiarVista('scripts')">📜 Scripts</button>
                <button id="tab-superadmin" class="tab-btn" style="display: none;" onclick="cambiarVista('superadmin')">👑 Gestión de Admins</button>
            </div>
            <button class="btn-logout" onclick="logout()">Cerrar Sesión</button>
        </div>

        <div class="content">
            <!-- Vista de Usuarios -->
            <div id="vista-usuarios" class="view-section active">
                <h2>Base de Datos: Usuarios</h2>
                <table>
                    <thead><tr><th>ID</th><th>Usuario</th><th>Contraseña (DB)</th><th>Rango</th><th>Premium</th></tr></thead>
                    <tbody id="tabla-usuarios"></tbody>
                </table>
            </div>

            <!-- Vista de Scripts -->
            <div id="vista-scripts" class="view-section">
                <h2>Base de Datos: Scripts</h2>
                <table>
                    <thead><tr><th>Nombre</th><th>Código / Data</th><th>Fecha</th></tr></thead>
                    <tbody id="tabla-scripts"></tbody>
                </table>
            </div>

            <!-- Vista Super Admin (Solo visible para 'owner') -->
            <div id="vista-superadmin" class="view-section">
                <h2 style="color: #8957e5;">Panel Exclusivo (Owner)</h2>
                <p>Lista de personas con acceso a este panel web:</p>
                <table>
                    <thead><tr><th>ID</th><th>Username</th><th>Rol en Panel</th></tr></thead>
                    <tbody id="tabla-admins"></tbody>
                </table>
            </div>
        </div>
    </div>

    <script>
        let myToken = '';
        let myRole = '';

        // --- SISTEMA DE AUTENTICACIÓN ---
        async function register() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('/api/auth/register', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            document.getElementById('auth-msg').innerText = data.error || data.message;
            if(!data.error) document.getElementById('auth-msg').style.color = '#3fb950';
        }

        async function login() {
            const u = document.getElementById('username').value;
            const p = document.getElementById('password').value;
            const res = await fetch('/api/auth/login', {
                method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify({username: u, password: p})
            });
            const data = await res.json();
            if (data.error) {
                document.getElementById('auth-msg').innerText = data.error;
                document.getElementById('auth-msg').style.color = '#f85149';
            } else {
                myToken = data.token;
                myRole = data.role;
                mostrarDashboard();
            }
        }

        function logout() {
            myToken = '';
            myRole = '';
            document.getElementById('dashboard-container').style.display = 'none';
            document.getElementById('auth-container').style.display = 'flex';
            document.getElementById('username').value = '';
            document.getElementById('password').value = '';
            document.getElementById('auth-msg').innerText = '';
        }

        // --- NAVEGACIÓN Y CARGA DE DATOS ---
        function mostrarDashboard() {
            document.getElementById('auth-container').style.display = 'none';
            document.getElementById('dashboard-container').style.display = 'flex';
            
            // Mostrar pestaña superadmin si es owner
            if (myRole === 'owner') {
                document.getElementById('tab-superadmin').style.display = 'flex';
            }
            
            cargarDatos('users', 'tabla-usuarios', renderUsuario);
            cargarDatos('scripts', 'tabla-scripts', renderScript);
            if (myRole === 'owner') cargarDatos('admins', 'tabla-admins', renderAdmin);
        }

        function cambiarVista(vista) {
            document.querySelectorAll('.view-section').forEach(el => el.classList.remove('active'));
            document.querySelectorAll('.tab-btn').forEach(el => el.classList.remove('active'));
            
            document.getElementById('vista-' + vista).classList.add('active');
            event.currentTarget.classList.add('active');
        }

        async function cargarDatos(endpoint, tbodyId, renderFunc) {
            const tbody = document.getElementById(tbodyId);
            tbody.innerHTML = '<tr><td colspan="5">Cargando...</td></tr>';
            try {
                const res = await fetch('/api/data/' + endpoint, { headers: { 'Authorization': myToken } });
                const data = await res.json();
                tbody.innerHTML = '';
                if (data.length === 0) tbody.innerHTML = '<tr><td colspan="5">No hay datos registrados.</td></tr>';
                data.forEach(item => tbody.appendChild(renderFunc(item)));
            } catch (e) {
                tbody.innerHTML = '<tr><td colspan="5" style="color:red;">Error de conexión</td></tr>';
            }
        }

        // --- RENDERIZADO DE FILAS ---
        function renderUsuario(u) {
            const tr = document.createElement('tr');
            const pass = u.password ? u.password : '<span style="color:#8b949e">Sin registro/Hash</span>';
            tr.innerHTML = `<td>${u._id}</td>
                            <td><strong>${u.username || 'N/A'}</strong></td>
                            <td style="font-family: monospace;">${pass}</td>
                            <td>${u.role || 'user'}</td>
                            <td>${u.premium ? '✅' : '❌'}</td>`;
            return tr;
        }

        function renderScript(s) {
            const tr = document.createElement('tr');
            tr.innerHTML = `<td><strong>${s.name || 'Sin nombre'}</strong></td>
                            <td style="font-family: monospace; font-size:12px; color:#8b949e;">${s.scriptData ? s.scriptData.substring(0,50) + '...' : 'Vacio'}</td>
                            <td>${new Date(s.createdAt).toLocaleDateString()}</td>`;
            return tr;
        }

        function renderAdmin(a) {
            const tr = document.createElement('tr');
            const badge = a.role === 'owner' ? '<span class="badge badge-owner">Owner</span>' : '<span class="badge" style="background:#30363d;">Admin</span>';
            tr.innerHTML = `<td>${a._id}</td>
                            <td><strong>${a.username}</strong></td>
                            <td>${badge}</td>`;
            return tr;
        }
    </script>
</body>
</html>
